repos:
  # Basic file integrity checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace   # Trims empty space at end of lines
      - id: end-of-file-fixer     # Ensures files end with a newline
      - id: check-yaml            # Checks if .yaml files are valid
      - id: check-added-large-files # Prevents committing massive data files (critical for Data/ML projects)
        args: ['--maxkb=10000']   # Limit 10MB (Adjust if needed)

  # Auto-formatting Python code (Black)
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3

  # Auto-sorting imports (isort)
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"] # Ensures isort agrees with Black's formatting
